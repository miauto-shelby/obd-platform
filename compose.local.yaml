name: my-auto-local

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - my-auto-local-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: my_auto_local
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  my-auto-local-mongo:
