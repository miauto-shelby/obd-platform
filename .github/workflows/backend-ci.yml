name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código de la rama
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Ejecutar pruebas del backend
        run: npm test
